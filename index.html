<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Komt de aflos al?</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background:
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
        url('brandweer-achtergrond.jpg');
    background-size: cover;
    background-position: center;
    min-height: 100vh;
    text-align: center;
}
.container { 
	padding: 40px 20px; 
	max-width: 100vw;
	overflow: hidden;}
	
h1 { font-size: 4em; }

button {
    font-size: 1.4em;
    padding: 15px 30px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #d32f2f;
    color: white;
}

button:hover { background: #b71c1c; }
#resultaat { margin-top: 40px; font-size: 4em; font-weight: bold; text-shadow: 0 0 10px rgba(0,0,0,0.8); }
#aftellen { margin-top: 15px; font-size: 2em; }
.zwaailicht { animation: blauwflits 0.6s infinite alternate; }
@keyframes blauwflits { from { box-shadow: inset 0 0 0 rgba(0,123,255,0); } to { box-shadow: inset 0 0 220px rgba(0,123,255,0.9); } }

/* Pulse animatie voor resultaat */
@keyframes pulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.02); }
    100% { transform: scale(1); }
}

#resultaat.ja {
	font-size: 5em;
    color: #ff1744;  /* fel rood voor JA */
    animation: pulse 1s infinite;
}

#resultaat.nee {
	font-size: 7em;
    color: #ffb300; /* fel oranje voor NEE */
    animation: pulse 1s infinite;
}

#aftellen {
    margin-top: 15px;
    font-size: 2.2em;  /* iets groter */
    font-weight: bold;
    text-shadow: 0 0 10px rgba(0,0,0,0.8);
}
#randomTekst {
    margin-top: 15px;
    font-size: 2.0em;  /* iets groter */
    font-weight: bold;
    text-shadow: 0 0 10px rgba(0,0,0,0.8);
}
#timer {
    margin-top: 30px;
    font-size: 4em;  /* iets groter */
    font-weight: bold;
    text-shadow: 0 0 10px rgba(0,0,0,0.8);
}
</style>
</head>
<body>
<div class="container">
<h1>🚨 Komt de aflos al?</h1>
<button id="btn-ochtend">🌅 Ochtenddienst</button>
<button id="btn-avond">🌆 Avonddienst</button>
<button id="btn-nacht">🌙 Nachtdienst</button>

<div id="resultaat"></div>
<!-- <div id="aftellen"></div> -->
<div id="randomTekst"></div>
<div id="timer"></div> 
</div>

	
<!-- Audio element toevoegen hier -->
<audio id="sireneAudio" src="https://www.myinstants.com/media/sounds/brandweer-sirene.mp3"></audio>
<script>
document.addEventListener("DOMContentLoaded", function() {

	// Willekeurige teksten voor tijdens aftellen
	const randomTeksten = [
	  "Nog even doorbijten…",
	  "Bevelvoerder twijfelt…",
	  "Je kan gerust nog om een bakkie pleur!",
	  "Staat de brandweerauto al in de kazerne…?",
	  "Waterdruk nog niet OK",
	  "Instappen! Op naar de volgende melding!",
	  "Slangen oprollen nog niet afgerond!",
	  "Uhh, Apipe is ook nog aan het werk!",
	  "Eerst inpakken voor je naar huis kan!"
	];

	// Functie om een random tekst te pakken
	function getRandomTekst() {
		const i = Math.floor(Math.random() * randomTeksten.length);
		return randomTeksten[i];
}

    let timer = null;
    let audioCtx = null;
    let sireneInterval = null;

    document.getElementById("btn-ochtend").addEventListener("click", function(){ startDienst("ochtend"); });
    document.getElementById("btn-avond").addEventListener("click", function(){ startDienst("avond"); });
    document.getElementById("btn-nacht").addEventListener("click", function(){ startDienst("nacht"); });

	function startDienst(dienst) {
		stopSirene();
		document.body.classList.remove("zwaailicht");
		clearInterval(timer);

		update(dienst); // update timer & resultaat

		// Kies één random tekst en voeg toe
		const randomEl = document.getElementById("randomTekst");

		// Alleen tonen als dienst nog niet voorbij is
		if (!document.getElementById("resultaat").classList.contains("ja")) {
			randomEl.textContent = getRandomTekst();
		} else {
			randomEl.textContent = ""; // geen tekst bij JA
		}

		timer = setInterval(function(){ update(dienst); }, 1000);
	}

	function update(dienst) {
		const now = new Date();
		let eindtijd = new Date(now); // begin met huidige datum en tijd

		if (dienst === "ochtend") {
			// Ochtenddienst: 06:30 – 14:30 vandaag
			eindtijd.setHours(14,30,0,0);

		} else if (dienst === "avond") {
			// Avonddienst: 14:30 – 22:30 vandaag
			eindtijd.setHours(22,30,0,0);

		} else if (dienst === "nacht") {
			// Nachtdienst: 22:30 – 06:30

			const nowH = now.getHours();
			const nowM = now.getMinutes();

			if ((nowH > 22) || (nowH === 22 && nowM >= 30)) {
				// 22:30 – 23:59 → dienst loopt tot morgen 06:30
				eindtijd.setDate(eindtijd.getDate() + 1);
				eindtijd.setHours(6,30,0,0);

			} else if (nowH < 6 || (nowH === 6 && nowM < 30)) {
				// 00:00 – 06:29 → dienst loopt tot vandaag 06:30
				eindtijd.setHours(6,30,0,0);

			} else {
				// 06:30 – 22:29 → nachtdienst nog niet begonnen → eindtijd morgen 06:30
				eindtijd.setDate(eindtijd.getDate() + 1);
				eindtijd.setHours(6,30,0,0);
			}
		}

		const verschil = eindtijd - now;
		const res = document.getElementById("resultaat");
		const timerEl = document.getElementById("timer");

		if (verschil <= 0) {
			res.textContent = "🎉 JA! JE MAG NAAR HUIS!";
			res.classList.remove("nee");
			res.classList.add("ja");
			timerEl.textContent = "";
			document.body.classList.add("zwaailicht");
			startSirene();
			clearInterval(timer);
		} else {
			const sec = Math.floor(verschil / 1000);
			const h = Math.floor(sec / 3600);
			const m = Math.floor((sec % 3600) / 60);
			const s = sec % 60;
			res.textContent = "⏳ NEE!";
			res.classList.remove("ja");
			res.classList.add("nee");
			timerEl.textContent = "Nog " + h + " uur " + m + " min " + s + " sec";
		}
	}

    function startSirene() {
    const audio = document.getElementById("sireneAudio");
    audio.currentTime = 0;   // start vanaf begin
    audio.play();

    // stop automatisch na 10 seconden
    setTimeout(function() {
        stopSirene();
    }, 5000);
}

function stopSirene() {
    const audio = document.getElementById("sireneAudio");
    audio.pause();
    audio.currentTime = 0;
}

});
</script>
</body>
</html>
